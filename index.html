<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Formula Fruit Fly</title>
  <link rel="stylesheet" href="/src/style.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Formula <span class="brand-accent">Fruit Fly</span></h1>
      <div id="status" role="status"></div>
      <nav id="main-nav">
        <button id="nav-tracks" class="active">My Tracks</button>
        <button id="nav-teams">My Teams</button>
        <button id="nav-races">Races</button>
      </nav>
    </header>
    <main id="view-tracks">
      <canvas id="editor" width="960" height="600"></canvas>
      <aside id="panel">
        <section>
          <h2>History</h2>
          <div class="row">
            <button id="btn-undo">Undo</button>
            <button id="btn-redo">Redo</button>
            <button id="btn-clear">Clear</button>
          </div>
        </section>
        <section>
          <h2>Drawing tools</h2>
          <div class="row">
            <button id="btn-tool-free" class="active">Free</button>
            <button id="btn-tool-line">Line</button>
            <button id="btn-tool-arc">Arc</button>
            <button id="btn-tool-erase">Erase</button>
          </div>
        </section>
        <section>
          <h2>Road</h2>
          <label>Width <input id="in-width" type="range" min="20" max="120" value="60" /> <span id="width-val">60</span></label>
          <div class="row">
            <button id="btn-start">Set start</button>
            <button id="btn-tool-gate">Checkpoint</button>
          </div>
          <div id="gate-editor" hidden>
            <h2 id="gate-title">Checkpoint</h2>
            <label>Gate width <input id="in-gate-width" type="range" min="20" max="160" value="60" /> <span id="gate-width-val">60</span></label>
            <div class="row">
              <button id="btn-gate-remove">Remove checkpoint</button>
            </div>
          </div>
        </section>
        <section>
          <h2>Saved tracks</h2>
          <div class="row">
            <input id="in-name" placeholder="track name" />
            <button id="btn-save">Save</button>
          </div>
          <div class="row">
            <select id="sel-tracks"></select>
            <button id="btn-load">Load</button>
            <button id="btn-del">Delete</button>
          </div>
          <div class="row">
            <button id="btn-export">Export JSON</button>
            <button id="btn-import">Import JSON</button>
            <button id="btn-import-img">Import image</button>
            <input id="file-import" type="file" accept="application/json" hidden />
            <input id="file-image" type="file" accept=".svg,.png,.jpg,.jpeg,image/svg+xml,image/png,image/jpeg" hidden />
          </div>
        </section>
        <section>
          <h2>Background</h2>
          <div class="row">
            <button id="btn-bg-import">Import</button>
            <button id="btn-bg-move">Move</button>
            <button id="btn-bg-remove">Remove</button>
          </div>
          <label>Scale <input id="in-bg-scale" type="range" min="5" max="800" value="100" /> <span id="bg-scale-val">100%</span></label>
          <input id="file-bg" type="file" accept="image/*,.svg" hidden />
        </section>
        <section>
          <h2>Checklist</h2>
          <ul id="checks"></ul>
        </section>
      </aside>
    </main>
    <section id="view-placeholder" hidden>
      <h2 id="placeholder-title">My Teams</h2>
      <p>Page under construction — check back later.</p>
    </section>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
